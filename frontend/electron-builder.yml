# =============================================================================
# Ninja Era Messenger — single authoritative electron-builder configuration.
# Do not add a package.json "build" block or a second electron-builder.* file.
#
# Code signing: intentionally unsigned until Soft Future provides a certificate.
# forceCodeSigning is false so missing credentials never fail the build.
# Electron-builder may log: "no signing info identified, signing is skipped"
# (signHook=false, cscInfo=null). That is expected and is not a project error.
#
# FUTURE Windows signing (no restructure required):
#   1. Set WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (or CSC_LINK / CSC_KEY_PASSWORD)
#   2. Optionally set forceCodeSigning: true in CI
#   3. Set win.verifyUpdateCodeSignature: true once updates are signed
# =============================================================================

appId: com.softfuture.ninjaera.messenger
productName: Ninja Era Messenger
# ASCII "(c)" survives Windows VERSIONINFO encoding reliably (© often becomes "c").
copyright: Copyright (c) 2026 Soft Future. All rights reserved.

forceCodeSigning: false

# electron-builder clears OriginalFilename during rcedit; restore after that pass.
# (signApp still finishes resource editing when code signing is skipped, so afterSign runs.)
afterSign: ./scripts/after-sign.cjs

extraMetadata:
  name: ninja-era-messenger
  description: Official desktop messaging application for Ninja Era.
  author:
    name: Soft Future
  homepage: https://ninjaera.up.railway.app

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: public/logo.png
    to: logo.png
  - from: public/favicon.png
    to: favicon.png
  - from: build/icon.ico
    to: icon.ico

publish:
  - provider: generic
    url: https://ninjaera.up.railway.app/desktop-updates/

# ── Windows ──────────────────────────────────────────────────────────────────
# Primary installer: Squirrel.Windows (Postman-style Setup.exe + splash GIF).
# Requires: electron-builder-squirrel-windows (dev) + electron-squirrel-startup (runtime).
win:
  executableName: NinjaEraMessenger
  icon: build/icon.ico
  # Embed ProductName / CompanyName / FileDescription / versions / icon via rcedit.
  signAndEditExecutable: true
  # Unsigned builds: do not require publisher signature checks on updates yet.
  verifyUpdateCodeSignature: false
  legalTrademarks: Soft Future
  target:
    - target: squirrel
      arch:
        - x64
    # Optional zip of the unpacked app (not the primary install path).
    - target: portable
      arch:
        - x64
  artifactName: NinjaEraMessenger-${version}-${arch}.${ext}

# Squirrel.Windows — per-user install under %LocalAppData%, Setup.exe + RELEASES/nupkg updates.
squirrelWindows:
  # HTTPS icon for Programs & Features (local file paths are not accepted by Squirrel).
  iconUrl: https://ninjaera.up.railway.app/favicon.png
  # Splash shown while Setup.exe installs (regenerate: npm run desktop:squirrel-spinner).
  # Also auto-picked if present at build/install-spinner.gif
  loadingGif: build/install-spinner.gif
  artifactName: NinjaEraMessenger-Setup-${version}.${ext}
  # Prefer appId over npm package name for Squirrel identity.
  useAppIdAsId: true

# NSIS kept as optional alternate (not in win.target). Restore by adding target: nsis.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ninja Era Messenger
  uninstallDisplayName: Ninja Era Messenger
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installer/installerSidebar.bmp
  uninstallerSidebar: build/installer/uninstallerSidebar.bmp
  installerHeader: build/installer/header.bmp
  include: build/installer/installer.nsh
  runAfterFinish: true
  artifactName: NinjaEraMessenger-NSIS-Setup-${version}.${ext}

portable:
  artifactName: NinjaEraMessenger-${version}-portable.${ext}

# ── macOS (build on macOS) ───────────────────────────────────────────────────
mac:
  icon: build/icon.png
  category: public.app-category.social-networking
  # No keychain identity until a Mac signing cert is available.
  identity: null
  target:
    - dmg
    - zip
  artifactName: NinjaEraMessenger-${version}-${arch}.${ext}

dmg:
  title: Ninja Era Messenger ${version}

# ── Linux (build on Linux) ───────────────────────────────────────────────────
linux:
  icon: build/icon.png
  category: Network
  maintainer: Soft Future
  vendor: Soft Future
  synopsis: Official desktop messaging application for Ninja Era.
  description: Official desktop messaging application for Ninja Era.
  target:
    - AppImage
    - deb
  artifactName: NinjaEraMessenger-${version}-${arch}.${ext}

appImage:
  artifactName: NinjaEraMessenger-${version}-${arch}.AppImage
