[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Volumes are attached in the Railway dashboard (Settings → Volumes), not here.
# Recommended mount path for local SQLite/uploads fallback: /data
# Prefer Railway Postgres + S3/R2 for production (see RAILWAY.md).
